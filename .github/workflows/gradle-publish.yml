name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Run lint
        run: ./gradlew lint

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Run Checkstyle
        run: ./gradlew checkstyle

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Run SpotBugs
        run: ./gradlew spotbugsMain

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Run tests
        run: ./gradlew test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Build release APK
        run: ./gradlew assembleRelease

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Remove hardcoded java.home for CI
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
